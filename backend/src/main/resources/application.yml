server:
  port: 8080

spring:
  application:
    name: face-recognition
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:face_recognition_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-please-change-in-production-min-32-bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

face:
  recognition:
    model-path: ${FACE_MODEL_PATH:./models/arcface_resnet100.onnx}
    threshold:
      possible: 0.80
      strong: 0.88
      high: 0.94

# Default admin account created on first boot if it doesn't already exist.
# CHANGE THE PASSWORD after first login in a real deployment.
app:
  default-admin:
    username: ${DEFAULT_ADMIN_USER:admin}
    password: ${DEFAULT_ADMIN_PASSWORD:Admin@123}
