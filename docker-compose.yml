version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: face-recognition-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: face_recognition_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: face-recognition-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: face_recognition_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-super-secret-key-in-production-min-32-bytes
      FILE_UPLOAD_DIR: /app/uploads
      FACE_MODEL_PATH: /app/models/arcface_resnet100.onnx
      DEFAULT_ADMIN_USER: admin
      DEFAULT_ADMIN_PASSWORD: Admin@123
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - ./models:/app/models:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: face-recognition-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads:
